<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101511">
<title>JAHUD SPORT</title>
<style>
:root{--bg:#101311;--panel:#171a18;--gold:#e9ce7a;--green:#3e8b57;--line:#ffffff26;--muted:#b9bbb4}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f8f7f2;font-family:Tahoma,Arial,sans-serif}button,input{font:inherit}button{cursor:pointer}
.app{max-width:1320px;margin:auto;min-height:100vh;background:linear-gradient(135deg,#111612,#101311 55%,#171a16)}
header{padding:20px 28px;display:flex;align-items:center;gap:22px;border-bottom:1px solid #ffffff18;background:#111612}
.brand{display:flex;align-items:center;gap:10px;white-space:nowrap}.brand-mark{width:52px;height:60px;display:grid;place-items:center;color:var(--gold);font-weight:900;font-size:30px;border:3px solid var(--gold);clip-path:polygon(50% 0,94% 15%,86% 68%,50% 100%,14% 68%,6% 15%)}
.brand b{font-size:25px;color:var(--gold);display:block}.brand small{display:block;letter-spacing:3px;font-size:11px;color:#d5cba9;margin-top:4px}
.nav{display:flex;gap:22px;align-items:center}.nav button{border:0;background:none;color:#eee;padding:10px 0;font-weight:bold;position:relative}.nav button.active:after{content:"";position:absolute;bottom:0;right:0;left:0;height:3px;background:#64a86d;border-radius:4px}
.tools{display:flex;gap:10px;align-items:center;margin-right:auto}.search{width:255px;border:1px solid #ffffff35;border-radius:30px;padding:12px 16px;background:#ffffff08;color:white;outline:none}.user{width:40px;height:40px;border-radius:50%;border:1px solid #ffffff30;background:#ffffff08;color:white}
.hero{min-height:176px;margin:0;border:1px solid #ffffff20;padding:28px 5%;display:flex;align-items:center;justify-content:space-between;gap:20px;background:radial-gradient(ellipse at 78% 40%,#75894a55,transparent 40%),linear-gradient(110deg,#121613,#1b271b 52%,#121613)}
.hero-copy{text-align:center;flex:1}.hero h1{margin:0 0 8px;color:var(--gold);font-size:clamp(25px,3vw,38px)}.hero p{margin:0;font-size:18px;color:#e6e6df}.actions{display:flex;gap:10px}.btn{border:0;border-radius:15px;padding:14px 22px;color:white;background:linear-gradient(110deg,#318455,#c8b75b);font-weight:bold}.btn.alt{background:#ffffff12;border:1px solid #ffffff25}
main{padding:0 4% 28px}.section-head{display:flex;align-items:center;justify-content:space-between;margin:28px 0 16px;gap:12px}.section-head h2{font-size:27px;margin:0}.subtle{color:var(--gold);text-decoration:underline;text-underline-offset:5px}
.categories{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 30px}.cat{border:1px solid #bdb58a66;background:transparent;color:#f5f2e9;border-radius:28px;padding:11px 20px;font-weight:bold}.cat.active{background:linear-gradient(110deg,#e7ca70,#69a85f);color:#171a14;border-color:transparent}
.match-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.match{border:1px solid #ffffff2d;border-radius:12px;padding:15px;background:linear-gradient(145deg,#1b1e1c,#121513)}.match-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;color:#d4d1c7;font-size:14px}.live{background:#c8424e;border-radius:20px;padding:5px 10px;font-weight:bold;color:#fff}.teams{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center}.team-logo{height:70px;display:grid;place-items:center}.team-logo img{max-width:65px;max-height:65px;object-fit:contain}.team-logo .fallback{font-size:38px;color:var(--gold)}.team-name{font-weight:bold;margin-top:6px}.time{background:#25272b;border:1px solid #ffffff13;border-radius:10px;padding:9px 12px;min-width:68px;font-weight:bold}.time small{display:block;font-weight:normal;font-size:12px;margin-top:4px}.match .btn{width:100%;margin-top:16px;padding:11px}
.channel-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.channel{min-height:86px;border:1px solid #ffffff30;border-radius:11px;background:linear-gradient(145deg,#1b1e1d,#131614);color:#f8f6ed;display:flex;align-items:center;justify-content:center;gap:12px;padding:14px;font-weight:bold;text-align:center}.channel:hover{border-color:var(--gold);background:#24271f}.channel-logo{width:92px;height:42px;object-fit:contain;display:block}.channel-wordmark{font-size:19px;direction:ltr;unicode-bidi:plaintext}.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:24px;border:1px dashed #ffffff2b;border-radius:12px}
footer{display:flex;justify-content:space-between;gap:15px;padding:18px 4%;border-top:1px solid #ffffff15;color:#b8b8b0;font-size:13px;background:#111413}
@media(max-width:900px){header{gap:15px;flex-wrap:wrap;padding:16px}.nav{order:3;width:100%;justify-content:space-between;gap:14px}.brand{margin-left:auto}.tools{order:2;margin-right:0}.search{width:210px}.match-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.channel-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){header{padding:14px 12px}.brand b{font-size:20px}.brand-mark{width:43px;height:49px}.tools{width:100%}.search{flex:1;width:auto}.nav button{font-size:13px}.hero{flex-direction:column;padding:24px 14px}.hero p{font-size:15px}.actions{order:2}.hero-copy{order:1}.hero .actions{order:2}.hero h1{font-size:27px}.hero p{line-height:1.7}main{padding:0 12px 24px}.section-head h2{font-size:22px}.cat{padding:9px 13px;font-size:13px}.match-grid{grid-template-columns:1fr}.channel-grid{grid-template-columns:1fr 1fr}.channel{padding:10px;min-height:76px}.channel-logo{width:70px;height:34px}.channel-wordmark{font-size:15px}footer{flex-direction:column;text-align:center}}
</style>
</head>
<body><div class="app">
<header>
  <div class="brand"><div class="brand-mark">J</div><div><b>جهود سبورت</b><small>JAHUD SPORT</small></div></div>
  <nav class="nav" aria-label="القائمة الرئيسية">
    <button class="active" data-page="home">الرئيسية</button><button data-page="news">الأخبار</button><button data-page="tournaments">البطولات</button><button data-page="channels">القنوات</button><button data-page="live">مباشر</button>
  </nav>
  <div class="tools"><input class="search" id="search" placeholder="ابحث عن قناة أو مباراة..." aria-label="بحث"><button class="user" aria-label="حساب المستخدم">♟</button></div>
</header>
<section class="hero">
  <div class="actions"><button class="btn" onclick="document.getElementById('matches-section').scrollIntoView({behavior:'smooth'})">▶ شاهد الآن</button><button class="btn alt" onclick="document.getElementById('channels-section').scrollIntoView({behavior:'smooth'})">القنوات</button></div>
  <div class="hero-copy"><h1>شاهد المباريات مباشرة وحصرياً</h1><p>استمتع بمتابعة أقوى المباريات على جهود سبورت</p></div>
</section>
<main>
  <section><div class="section-head"><h2>الفئات - قنوات كرة القدم</h2></div>
    <div class="categories" id="categories">
      <button class="cat active" data-cat="home">القائمة الرئيسية</button>
      <button class="cat" data-cat="beIN SPORTS">beIN SPORTS</button>
      <button class="cat" data-cat="Alwan Sport">Alwan Sport</button>
      <button class="cat" data-cat="THAMANYAH">THAMANYAH</button>
      <button class="cat" data-cat="Al kass">Al kass</button>
      <button class="cat" data-cat="JAHUD SPORT">JAHUD SPORT</button>
    </div>
  </section>
  <section id="matches-section">
    <div class="section-head"><h2 id="section-title">مباريات اليوم</h2><span class="subtle" id="result-count">جارٍ تحميل المباريات…</span></div>
    <div class="match-grid" id="matches"><div class="empty">جارٍ تحميل مباريات اليوم…</div></div>
  </section>
  <section id="channels-section">
    <div class="section-head"><h2 id="channel-title">القنوات المميزة</h2><span class="subtle" id="channel-count"></span></div>
    <div class="channel-grid" id="channel-grid"></div>
  </section>
</main>
<footer><span>الدعم · تواصل معنا · سياسة الخصوصية</span><span>© جميع الحقوق محفوظة · جهود سبورت</span></footer>
</div>
<script>
const API='https://webws.365scores.com/web/games/';
const groups={
 'beIN SPORTS':8,'Alwan Sport':8,'THAMANYAH':3,'Al kass':10,'JAHUD SPORT':6
};
const channels=Object.entries(groups).flatMap(([group,n])=>Array.from({length:n},(_,i)=>({group,name:`${group} ${i+1}`})));
let active='home',allGames=[];
const $=id=>document.getElementById(id);
function renderChannels(){
 const q=$('search').value.trim().toLowerCase();
 const list=channels.filter(c=>c.group===active&&c.name.toLowerCase().includes(q));
 $('channels-section').style.display=(groups[active]?'':'none');
 $('channel-title').textContent=active;
 $('channel-count').textContent=`${list.length} قناة`;
 $('channel-grid').innerHTML=list.length?list.map(c=>`<button class="channel" type="button" data-name="${c.name}"><span class="channel-wordmark">${c.name}</span></button>`).join(''):'<div class="empty">لا توجد قنوات مطابقة.</div>';
}
function setCategory(cat){
 active=cat;
 document.querySelectorAll('.cat').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));
 if(cat==='home'||cat==='live'){ $('section-title').textContent='مباريات اليوم';$('matches-section').style.display='';}
 else {$('section-title').textContent=cat;$('matches-section').style.display='none';}
 renderChannels();
}
$('categories').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(b)setCategory(b.dataset.cat)});
$('search').addEventListener('input',()=>{renderChannels();if(active==='home'||active==='live')renderGames()});
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>{
 document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x===b));
 const page=b.dataset.page;
 if(page==='channels'){setCategory('beIN SPORTS');$('channels-section').scrollIntoView({behavior:'smooth'});}
 else if(page==='live'){setCategory('live');$('matches-section').scrollIntoView({behavior:'smooth'});}
 else if(page==='home'){setCategory('home');window.scrollTo({top:0,behavior:'smooth'});}
 else {setCategory('home');$('matches-section').scrollIntoView({behavior:'smooth'});}
}));
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function logoURL(c){return c?.imageVersion!==undefined&&c?.id?`https://imagecache.365scores.com/image/upload/f_png,w_120,h_120,c_limit,q_auto:eco,d_Competitors:default.png/v${c.imageVersion}/Competitors/${c.id}`:''}
function timeLabel(iso){try{return new Intl.DateTimeFormat('ar-IQ',{hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date(iso));}catch{return '--:--'}}
function renderGames(){
 const q=$('search').value.trim().toLowerCase();
 const games=allGames.filter(g=>g.sportId===1 && (!q||`${g.homeCompetitor?.name||''} ${g.awayCompetitor?.name||''} ${g.competitionDisplayName||''}`.toLowerCase().includes(q)));
 $('result-count').textContent=`${games.length} مباراة`;
 $('matches').innerHTML=games.length?games.map(g=>{
 const home=g.homeCompetitor||{},away=g.awayCompetitor||{};
 const badge=g.statusGroup===2||g.statusGroup===3?'● مباشر LIVE':esc(g.shortStatusText||'اليوم');
 return `<article class="match"><div class="match-top"><span>${esc(g.competitionDisplayName||'كرة القدم')}</span><span class="live">${badge}</span></div><div class="teams">
 <div><div class="team-logo">${logoURL(home)?`<img src="${logoURL(home)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">`:''}<span class="fallback" style="${logoURL(home)?'display:none':''}">⚽</span></div><div class="team-name">${esc(home.name||'الفريق الأول')}</div></div>
 <div class="time">${home.score!=null&&away.score!=null?`${esc(home.score)} - ${esc(away.score)}`:timeLabel(g.startTime)}<small>${esc(g.shortStatusText||'اليوم')}</small></div>
 <div><div class="team-logo">${logoURL(away)?`<img src="${logoURL(away)}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='block'">`:''}<span class="fallback" style="${logoURL(away)?'display:none':''}">⚽</span></div><div class="team-name">${esc(away.name||'الفريق الثاني')}</div></div>
 </div><button class="btn" onclick="alert('لا يوجد رابط بث مضاف لهذه المباراة.')">▶ تفاصيل المباراة</button></article>`;
 }).join(''):'<div class="empty">لا توجد مباريات كرة قدم مطابقة حالياً. جرّب تحديث الصفحة لاحقاً.</div>';
}
async function loadGames(){
 try{
  const response=await fetch(API,{headers:{'Accept':'application/json'}});
  if(!response.ok)throw new Error('HTTP '+response.status);
  const data=await response.json();
  allGames=Array.isArray(data.games)?data.games:[];
  // تعرض مباريات اليوم حسب توقيت الجهاز، مع مباريات كرة القدم فقط.
  const today=new Date();const key=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
  allGames=allGames.filter(g=>g.sportId===1 && String(g.startTime||'').slice(0,10)===key);
  renderGames();
 }catch(err){
  $('result-count').textContent='تعذر الاتصال';
  $('matches').innerHTML='<div class="empty">لم نتمكن من جلب المباريات من المصدر الآن. قد يمنع المتصفح الاتصال المباشر (CORS) أو يكون المصدر غير متاح. جرّب فتح الموقع عبر استضافة HTTPS.</div>';
 }
}
$('channel-grid').addEventListener('click',e=>{const b=e.target.closest('[data-name]');if(b)alert(`تم اختيار ${b.dataset.name} — لا يوجد رابط بث مضاف لهذه القناة.`)});
renderChannels();loadGames();
</script>
</body></html>
