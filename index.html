<style>
*{box-sizing:border-box;margin:0;padding:0;outline:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{width:100%;height:100%;background-color:#0b0f19;color:#fff;overflow:hidden;font-family:Tahoma,Arial,sans-serif;user-select:none;-webkit-user-select:none}
.screen{position:fixed;inset:0;display:none;flex-direction:column;background-color:#0b0f19;background-image:radial-gradient(circle at 50% -10%,#14233f,#0b0f19 65%)}

/* الترحيب والتفعيل */
#activation{position:fixed;inset:0;background-color:#070a12;background-image:radial-gradient(circle at 50% 0%,#14233f,#070a12 70%);z-index:500;display:none;justify-content:center;align-items:center;overflow-y:auto}
#activation.active{display:flex}
.card{background:#141c30;border:2px solid #38bdf866;border-radius:22px;padding:26px 22px;width:92%;max-width:430px;text-align:center;box-shadow:0 0 40px #38bdf826;margin:auto}
.card h1{font-size:1.5rem;font-weight:900;margin-bottom:6px;background:linear-gradient(90deg,#fff,#7dd3fc);-webkit-background-clip:text;background-clip:text;color:transparent}
.card .sub{color:#e2e8f0;font-size:.95rem;font-weight:700;margin-bottom:8px}
.card p{color:#cbd5e1;font-size:.88rem;margin-bottom:16px;line-height:1.7}
.card input{width:100%;background:#0a0f19;border:1.5px solid #38bdf880;border-radius:12px;padding:12px;font-size:1.4rem;color:#fff;text-align:center;letter-spacing:6px;margin-bottom:12px}
.btn{display:block;width:100%;background:linear-gradient(135deg,#0284c7,#38bdf8);border:0;border-radius:12px;padding:12px;color:#fff;font-size:1.05rem;font-weight:700;cursor:pointer;margin-bottom:12px;text-decoration:none}
.tg{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;background:#1e90ff26;border:1px solid #1e90ff80;border-radius:12px;padding:11px;color:#38bdf8;font-size:.95rem;font-weight:800;text-decoration:none}
.tg svg{width:26px;height:26px;fill:#38bdf8;flex:none}

#count{font-size:.8rem;color:#64748b;font-weight:700}

#grid::-webkit-scrollbar,#mainView::-webkit-scrollbar{width:0}
.ch{cursor:pointer;position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:10px 10px 9px;border-radius:18px;background:linear-gradient(160deg,#ffffff12,#ffffff05);border:1px solid #ffffff14;box-shadow:0 8px 22px #00000055}
.ch:active,.ch:focus{border-color:#38bdf8;box-shadow:0 0 0 2px #38bdf8,0 10px 28px #38bdf855}
.ch img{width:100%;height:auto;aspect-ratio:9/2;border-radius:12px;display:block}
.ch span{font-size:.82rem;font-weight:800;text-align:center;width:100%;color:#e2e8f0;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.ch.soon img{filter:saturate(.7) brightness(.85)}
.tag{position:absolute;top:6px;left:6px;background:#f59e0b;color:#1a1100;font-size:.62rem;font-weight:900;padding:3px 9px;border-radius:10px;box-shadow:0 2px 8px #0008}

.m{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:6px;padding:7px 10px;border-radius:13px;background:linear-gradient(160deg,#ffffff12,#ffffff05);border:1px solid #ffffff14;box-shadow:0 5px 14px #00000055;margin-bottom:7px}
.tm{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.tm span{font-size:.74rem;font-weight:800;color:#e2e8f0;text-align:center;white-space:nowrap}
.mid{display:flex;flex-direction:column;align-items:center;gap:3px}
.mid i{font-style:normal;font-size:.58rem;font-weight:900;color:#64748b;letter-spacing:1px}
.mid b{background:linear-gradient(135deg,#0284c7,#38bdf8);color:#fff;font-size:.8rem;font-weight:900;padding:3px 10px;border-radius:10px;direction:ltr;box-shadow:0 3px 10px #0284c755}

/* القائمة السفلية (مصغّرة) */
nav{position:fixed;bottom:0;left:0;right:0;height:50px;background-color:#0b0f19;display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch;border-top:1px solid #ffffff14;z-index:100;box-shadow:0 -6px 18px #0009}
nav::-webkit-scrollbar{height:0}
nav div{flex:1 0 auto;display:flex;align-items:center;justify-content:center;white-space:nowrap;padding:0 14px;color:#64748b;font-weight:800;cursor:pointer;font-size:.72rem;border-top:2px solid transparent}
nav div.active{color:#38bdf8;border-top-color:#38bdf8;background:linear-gradient(#38bdf816,transparent)}

/* المشغل */
#player{z-index:200;background:#000}
video#v{position:absolute;inset:0;width:100%;height:100%;background:#000;object-fit:fill;z-index:1}
video#v.fill{object-fit:fill}
video#v.cover{object-fit:cover}
video#v.contain{object-fit:contain}
#tap{position:absolute;inset:0;z-index:5}
#spinner{position:absolute;top:50%;left:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border:5px solid #ffffff26;border-top-color:#38bdf8;border-radius:50%;animation:sp .8s linear infinite;z-index:6;pointer-events:none}
#spinner.hide{display:none}
@keyframes sp{to{transform:rotate(360deg)}}

#wm{position:absolute;top:12px;right:16px;z-index:40;pointer-events:none;display:none}
#wm.on{display:block}
#wm img{height:38px;display:block;border-radius:10px;filter:drop-shadow(0 3px 8px #000a)}

#topbar{position:absolute;top:0;left:0;right:0;z-index:35;display:flex;direction:ltr;justify-content:flex-start;align-items:center;padding:14px 16px 40px;background:linear-gradient(#000a,transparent);transition:opacity .3s;pointer-events:none}
#live{font-size:.8rem;font-weight:900;background:#ef444430;border:1px solid #ef4444aa;border-radius:16px;padding:6px 14px;direction:rtl}
#bar{position:absolute;bottom:0;left:0;right:0;z-index:35;display:flex;justify-content:center;gap:14px;padding:36px 12px 20px;background:linear-gradient(transparent,#000d);transition:opacity .3s}
.cb{width:52px;height:52px;border-radius:50%;background:#ffffff26;border:1px solid #ffffff40;display:flex;justify-content:center;align-items:center;cursor:pointer}
.cb svg{width:24px;height:24px;fill:#fff}
.cb.main{width:64px;height:64px;background:linear-gradient(135deg,#0284c7,#38bdf8)}
.hide-ui{opacity:0;pointer-events:none}
#toast{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);background:#0f1624f2;border:1px solid #38bdf8;color:#38bdf8;padding:10px 22px;border-radius:26px;font-weight:700;z-index:600;display:none;font-size:.9rem;max-width:90%;text-align:center}
</style>

const LISTS={main:[],sports:sports,jihad:jihad,alwan:alwan,english:english,rabia:rabia};
const TITLES={main:'الرئيسية',sports:'beIN SPORTS',jihad:'JIHAD OTT',alwan:'Alwan Sport',english:'الرياضة الإنجليزية',rabia:'قنوات الرابعة'};
const CATS=['main','sports','jihad','alwan','english','rabia'];

/* ===== المتغيرات ===== */
const $=id=>document.getElementById(id);
const video=$('v');
let cat='main',cur=0,mp=null,secs=0,tInt=null,stall=null,lastT=-1,frozen=0,wdog=null,uiTimer=null,fit=0,stream=null;
let lastTap=0,inPlayerHist=false,exitArmed=false,exitTimer=null,lastResume=0;

function ok(){const n=Date.now();if(n-lastTap<300)return false;lastTap=n;return true}
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display='none',2500)}
function show(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}
function isOn(){try{return localStorage.getItem('jihad_ok')==='1'}catch(e){return false}}

/* ===== التفعيل ===== */
function H(s){let h=5381;for(let i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0;h=(h^(h>>>13))>>>0}return h.toString(36)}
const KEY='qwfuxi';
function verify(){
 const v=$('code').value.trim();
 if(H('jo#'+v+'#tt')===KEY){
  try{localStorage.setItem('jihad_ok','1')}catch(e){}
  $('activation').classList.remove('active');$('code').value='';
  toast('تم التفعيل ✔');showCat('main');
 }else{toast('❌ الكود غير صحيح');$('code').value=''}
}
$('code').addEventListener('keydown',e=>{if(e.key==='Enter')verify()});
function showAct(){$('activation').classList.add('active')}

/* ===== الرئيسية ===== */
function navTo(c){if(!ok())return;showCat(c)}
function showCat(c){
 cat=c;show('home');
 $('title').textContent=TITLES[c];
 CATS.forEach(k=>$('nav-'+k).classList.toggle('active',c===k));
 try{$('nav-'+c).scrollIntoView({inline:'center',block:'nearest'})}catch(e){}
 const g=$('grid'),mv=$('mainView');
 if(c==='main'){
  $('count').textContent='';
  g.style.display='none';g.innerHTML='';
  mv.style.display='block';mv.scrollTop=0;
  renderMatches();
  return;
 }
 mv.style.display='none';g.style.display='grid';
 $('count').textContent=LISTS[c].length+' قناة';
 const f=document.createDocumentFragment();g.innerHTML='';g.scrollTop=0;
 LISTS[c].forEach((ch,i)=>{
  const d=document.createElement('div');d.className='ch'+(ch.soon?' soon':'');d.tabIndex=0;
  d.onclick=()=>{if(!ok())return;if(ch.soon)toast('⏳ '+ch.name+' — قريباً');else openCh(i)};
  const im=new Image();im.src=ch.logo;im.alt=ch.name;
  const s=document.createElement('span');s.textContent=ch.name;
  d.append(im,s);
  if(ch.soon){const t=document.createElement('div');t.className='tag';t.textContent='قريباً';d.appendChild(t)}
  f.appendChild(d);
 });
 g.appendChild(f);
}

/* ===== زر الرجوع ===== */
function pushHome(){try{history.pushState({s:'home'},'')}catch(e){}}
function initHistory(){try{history.replaceState({s:'root'},'');history.pushState({s:'home'},'')}catch(e){}}
window.addEventListener('popstate',e=>{
 const st=e.state&&e.state.s;
 if($('player').classList.contains('active')){inPlayerHist=false;leavePlayer();return}
 if($('activation').classList.contains('active')){pushHome();return}
 if(st==='root'||!st){
  if(cat!=='main'){showCat('main');pushHome();return}
  if(exitArmed){exitArmed=false;try{history.back()}catch(err){}return}
  exitArmed=true;toast('اضغط رجوع مرة أخرى للخروج');pushHome();
  clearTimeout(exitTimer);exitTimer=setTimeout(()=>{exitArmed=false},2000);
 }
});

/* ===== المشغل ===== */
function openCh(i){
 show('player');fit=0;video.className='fill';
 try{history.pushState({s:'player'},'');inPlayerHist=true}catch(e){inPlayerHist=false}
 try{(document.documentElement.requestFullscreen||function(){}).call(document.documentElement)}catch(e){}
 playCh(i);
}
function leavePlayer(){
 stopAll();stream=null;
 $('wm').classList.remove('on');
 try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}
 showCat(cat);
}
function backHome(){
 if(!ok())return;
 if(inPlayerHist){try{history.back();return}catch(e){}}
 leavePlayer();
}
function killPlayer(){
 if(mp){try{mp.pause();mp.unload();mp.detachMediaElement();mp.destroy()}catch(e){}mp=null}
 try{video.pause();video.removeAttribute('src');video.load()}catch(e){}
}
function stopAll(){
 clearTimeout(wdog);clearInterval(stall);clearInterval(tInt);
 killPlayer();
}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function tsUrl(u){return u.replace(/\.m3u8(\?.*)?$/i,'.ts')}

function startVideo(){
 if(!stream)return;
 killPlayer();
 clearTimeout(wdog);
 $('spinner').classList.remove('hide');
 video.muted=false;
 try{
  if(window.mpegts&&mpegts.getFeatureList().mseLivePlayback){
   mp=mpegts.createPlayer({type:'mpegts',isLive:true,url:tsUrl(stream.url)},{
    enableWorker:true,enableStashBuffer:true,stashInitialSize:1024*1024,
    liveBufferLatencyChasing:false,autoCleanupSourceBuffer:true,
    autoCleanupMaxBackwardDuration:30,autoCleanupMinBackwardDuration:10
   });
   mp.attachMediaElement(video);
   mp.on(mpegts.Events.ERROR,()=>retry());
   mp.load();tryPlay();
  }else{video.src=tsUrl(stream.url);tryPlay()}
 }catch(e){retry()}
 wdog=setTimeout(startVideo,12000);
}
function retry(){
 if(!stream)return;
 clearTimeout(wdog);
 $('spinner').classList.remove('hide');
 wdog=setTimeout(startVideo,2000);
}
function tryPlay(){
 try{
  const p=mp?mp.play():video.play();
  if(p&&p.catch)p.catch(()=>{video.muted=true;video.play().then(()=>setTimeout(()=>video.muted=false,500)).catch(()=>{})});
 }catch(e){}
}

function playCh(i){
 const list=LISTS[cat],n=list.length;
 cur=(i+n)%n;const ch=list[cur];
 if(!ch.url)return;
 stopAll();stream=ch;
 if(cat==='jihad'){$('plogo').src=ch.logo;$('wm').classList.add('on')}
 else{$('plogo').removeAttribute('src');$('wm').classList.remove('on')}
 secs=0;$('live').textContent='● بث مباشر 00:00';
 tInt=setInterval(()=>{secs++;$('live').textContent='● بث مباشر '+fmt(secs)},1000);
 lastT=-1;frozen=0;
 stall=setInterval(()=>{
  if(video.paused||video.readyState<2)return;
  if(video.currentTime===lastT){if(++frozen>=4){frozen=0;startVideo()}}
  else{frozen=0;lastT=video.currentTime}
 },2000);
 startVideo();showUI();
}

video.addEventListener('playing',()=>{
 clearTimeout(wdog);
 $('spinner').classList.add('hide');
 $('ppi').innerHTML='<path d="M6 19h4V5H6zm8-14v14h4V5z"></path>';
});
video.addEventListener('waiting',()=>$('spinner').classList.remove('hide'));
video.addEventListener('error',()=>{if(stream)retry()});

/* ===== التحكم ===== */
function hideUI(){$('bar').classList.add('hide-ui');$('topbar').classList.add('hide-ui')}
function showUI(){
 $('bar').classList.remove('hide-ui');$('topbar').classList.remove('hide-ui');
 clearTimeout(uiTimer);uiTimer=setTimeout(hideUI,4500);
}
function toggleUI(){
 if($('bar').classList.contains('hide-ui'))showUI();
 else{clearTimeout(uiTimer);hideUI()}
}
function step(d){
 if(!ok())return;
 const list=LISTS[cat],n=list.length;let i=cur;
 for(let k=0;k<n;k++){i=(i+d+n)%n;if(list[i].url){playCh(i);return}}
}
function playPause(){
 if(!ok())return;
 if(video.paused){tryPlay();$('ppi').innerHTML='<path d="M6 19h4V5H6zm8-14v14h4V5z"></n>'}
 else{video.pause();$('ppi').innerHTML='<path d="M8 5v14l11-7z"></path>'}
 showUI();
}
function mute(){
 if(!ok())return;
 video.muted=!video.muted;
 $('mi').innerHTML=video.muted
  ?'<path d="M16.5 12A4.5 4.5 0 0014 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a9 9 0 003.69-1.81L19.73 21 21 19.73l-9-9zM12 4L9.91 6.09 12 8.18z"></path>'
  :'<path d="M3 9v6h4l5 5V4L7 9zm13.5 3A4.5 4.5 0 0014 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"></path>';
 showUI();
}
const FITS=[['fill','ملء الشاشة'],['cover','تقريب: يملأ مع قص الأطراف'],['contain','أصلي: القناة بنسبتها الأصلية']];
function aspect(){if(!ok())return;fit=(fit+1)%3;video.className=FITS[fit][0];toast(FITS[fit][1]);showUI()}

document.addEventListener('keydown',e=>{
 if(!$('player').classList.contains('active'))return;
 const k=e.keyCode;
 if(k===27||k===8||k===461){backHome();e.preventDefault()}
 else if(k===38||k===33){step(1);e.preventDefault()}
 else if(k===40||k===34){step(-1);e.preventDefault()}
 else if(k===32){playPause();e.preventDefault()}
 else showUI();
});

/* ===== حل الشاشة البيضاء/السودة بعد الخروج والرجوع ===== */
function repaint(){
 const b=document.body;
 b.style.willChange='transform';b.style.transform='translateZ(0)';void b.offsetHeight;
 requestAnimationFrame(()=>{b.style.transform='';b.style.willChange=''});
}
function ensureScreen(){
 const anyActive=document.querySelector('.screen.active')||$('activation').classList.contains('active');
 if(!anyActive){if(isOn())showCat(cat||'main');else showAct()}
}
function onHide(){
 try{if(document.fullscreenElement)document.exitFullscreen()}catch(e){}
 if(stream){clearTimeout(wdog);killPlayer()}
}
function onResume(){
 if(document.hidden)return;
 const n=Date.now();if(n-lastResume<400)return;lastResume=n;
 ensureScreen();
 if($('player').classList.contains('active')){if(stream)startVideo()}
 else if(!$('activation').classList.contains('active')&&isOn()){showCat(cat)}
 repaint();
 [150,600,1500].forEach(t=>setTimeout(()=>{repaint();ensureScreen()},t));
}
document.addEventListener('visibilitychange',()=>{document.hidden?onHide():onResume()});
window.addEventListener('pageshow',onResume);
window.addEventListener('pagehide',onHide);
window.addEventListener('focus',onResume);
document.addEventListener('resume',onResume);
window.addEventListener('resize',()=>{repaint()});
window.addEventListener('orientationchange',()=>setTimeout(repaint,300));

/* ===== البداية ===== */
function boot(){
 initHistory();
 if(isOn())showCat('main');else showAct();
 setTimeout(ensureScreen,1200);
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
</script>
