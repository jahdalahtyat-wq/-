<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>جهود سبورت</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.15/dist/hls.min.js"></script>
<style>
:root{--bg:#0c1a14;--panel:#12261c;--line:#1f3d2d;--text:#eef5f0;--mute:#8fa89a;--acc:#f2b705}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.hidden{display:none!important}

/* شاشة التفعيل */
#lock{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-box{width:100%;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:32px 24px;text-align:center}
.lock-box h1{font-size:28px;color:var(--acc);margin-bottom:6px}
.lock-box p{color:var(--mute);margin-bottom:20px;font-size:14px}
.lock-box input{width:100%;padding:13px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:18px;text-align:center;letter-spacing:4px;outline:none}
.lock-box input:focus{border-color:var(--acc)}
.lock-box button{width:100%;margin-top:12px;padding:13px;border:0;border-radius:8px;background:var(--acc);color:#1a1400;font-size:16px;font-weight:bold;cursor:pointer}
#err{color:#ff6b6b;font-size:13px;margin-top:10px;min-height:18px}

/* الموقع */
header{padding:16px 20px;background:var(--panel);border-bottom:2px solid var(--acc);display:flex;justify-content:space-between;align-items:center}
header h1{font-size:22px;color:var(--acc)}
header button{background:none;border:1px solid var(--line);color:var(--mute);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}
main{max-width:1000px;margin:0 auto;padding:16px}
.player{background:#000;border-radius:10px;overflow:hidden;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;position:relative}
.player video,.player iframe{width:100%;height:100%;border:0}
.fsbtn{position:absolute;top:10px;left:10px;z-index:5;background:rgba(0,0,0,.65);color:#fff;border:1px solid rgba(255,255,255,.35);padding:7px 12px;border-radius:6px;font-size:13px;font-family:inherit;cursor:pointer}
.fsbtn:hover{background:var(--acc);color:#1a1400}
.player:fullscreen{border-radius:0;aspect-ratio:auto;width:100vw;height:100vh}
.player:-webkit-full-screen{border-radius:0;aspect-ratio:auto;width:100vw;height:100vh}
.player.pfs{position:fixed;top:0;left:0;width:100vw;height:100vh;aspect-ratio:auto;border-radius:0;z-index:9999}
.player.pfs.rot{width:100vh;height:100vw;transform-origin:top left;transform:rotate(90deg) translateY(-100%)}
#msg{color:var(--mute);font-size:15px;text-align:center;padding:20px;position:absolute}
#now{margin:12px 2px;color:var(--mute);font-size:14px}
#now b{color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:8px}
.ch{background:var(--panel);border:1px solid var(--line);color:var(--text);padding:16px 8px;border-radius:10px;cursor:pointer;font-size:15px;font-family:inherit;transition:.15s}
.ch:hover{border-color:var(--acc)}
.ch.on{background:var(--acc);color:#1a1400;border-color:var(--acc);font-weight:bold}
</style>
</head>
<body>

<!-- شاشة كود التفعيل -->
<div id="lock">
  <div class="lock-box">
    <h1>جهود سبورت</h1>
    <p>أدخل كود التفعيل لفتح الموقع</p>
    <input id="code" type="password" inputmode="numeric" placeholder="•••" maxlength="10">
    <button onclick="unlock()">تفعيل</button>
    <div id="err"></div>
  </div>
</div>

<!-- الموقع -->
<div id="site" class="hidden">
  <header>
    <h1>جهود سبورت</h1>
    <button onclick="lockSite()">خروج</button>
  </header>
  <main>
    <div class="player" id="player">
      <button class="fsbtn" id="fsbtn" onclick="toggleFS()">⛶ ملء الشاشة</button>
      <div id="msg">اختر قناة للمشاهدة</div>
      <video id="video" controls playsinline class="hidden"></video>
      <iframe id="frame" class="hidden" allowfullscreen allow="autoplay; fullscreen"></iframe>
    </div>
    <div id="now"></div>
    <div class="grid" id="list"></div>
  </main>
</div>

<script>
const ACTIVATION_CODE = '313';

/* ===== ضيف روابط القنوات بين '' =====
   رابط .m3u8 يشتغل بالمشغل المباشر، وأي رابط ثاني (embed) يشتغل بإطار */
const channels = [
  { name: 'جهود سبورت 1',  url: 'http://falconpro.me/live/7445392366/2289886702/738881.m3u8?_proxy_ts=' },
  { name: 'جهود سبورت 2',  url: 'http://falconpro.me/live/7445392366/2289886702/738880.m3u8?_proxy_ts=' },
  { name: 'جهود سبورت 3',  url: 'http://falconpro.me/live/7445392366/2289886702/738879.m3u8?_proxy_ts=' },
  { name: 'جهود سبورت 4',  url: 'http://falconpro.me/live/7445392366/2289886702/738878.m3u8?_proxy_ts=' },
  { name: 'جهود سبورت 5',  url: 'http://falconpro.me/live/7445392366/2289886702/738877.m3u8?_proxy_ts=' },
  { name: 'جهود سبورت 6',  url: 'http://falconpro.me/live/7445392366/2289886702/738876.m3u8?_proxy_ts=' },
  { name: 'جهود سبورت 7',  url: 'http://falconpro.me/live/7445392366/2289886702/738872.m3u8?_proxy_ts=' },
  { name: 'جهود سبورت 8',  url: 'http://falconpro.me/live/7445392366/2289886702/738873.m3u8?_proxy_ts=' },
  { name: 'جهود سبورت 9',  url: 'http://falconpro.me/live/7445392366/2289886702/738874.m3u8?_proxy_ts=' },
  { name: 'جهود سبورت 10', url: 'http://falconpro.me/live/7445392366/2289886702/738875.m3u8?_proxy_ts=' }
];

const $ = id => document.getElementById(id);
let hls = null;

function showSite(){ $('lock').classList.add('hidden'); $('site').classList.remove('hidden'); }

function unlock(){
  if ($('code').value.trim() === ACTIVATION_CODE){
    try { localStorage.setItem('juhood_ok', '1'); } catch(e){}
    showSite();
  } else {
    $('err').textContent = 'الكود غير صحيح، حاول مرة ثانية';
  }
}
$('code').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

function lockSite(){
  try { localStorage.removeItem('juhood_ok'); } catch(e){}
  stop();
  $('site').classList.add('hidden');
  $('lock').classList.remove('hidden');
  $('code').value = '';
  $('err').textContent = '';
}

function stop(){
  if (hls){ hls.destroy(); hls = null; }
  const v = $('video'); v.pause(); v.removeAttribute('src'); v.load();
  v.classList.add('hidden');
  $('frame').src = 'about:blank';
  $('frame').classList.add('hidden');
}

function play(i){
  const ch = channels[i];
  document.querySelectorAll('.ch').forEach((b, n) => b.classList.toggle('on', n === i));
  stop();
  $('now').innerHTML = 'تشاهد الآن: <b>' + ch.name + '</b>';

  if (!ch.url){
    $('msg').classList.remove('hidden');
    $('msg').textContent = 'هذه القناة غير متوفرة حالياً';
    return;
  }
  $('msg').classList.add('hidden');

  if (ch.url.includes('.m3u8')){
    const v = $('video'); v.classList.remove('hidden');
    if (window.Hls && Hls.isSupported()){
      hls = new Hls(); hls.loadSource(ch.url); hls.attachMedia(v);
      hls.on(Hls.Events.MANIFEST_PARSED, () => v.play().catch(()=>{}));
    } else {
      v.src = ch.url; v.play().catch(()=>{});
    }
  } else {
    $('frame').classList.remove('hidden');
    $('frame').src = ch.url;
  }
}

/* ===== ملء الشاشة بالعرض ===== */
function lockLand(){
  try { const p = screen.orientation && screen.orientation.lock('landscape'); if (p && p.catch) p.catch(()=>{}); } catch(e){}
}
function unlockLand(){
  try { screen.orientation && screen.orientation.unlock && screen.orientation.unlock(); } catch(e){}
}
function isFS(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement || $('player').classList.contains('pfs'));
}
function pseudoFS(){
  const p = $('player');
  p.classList.add('pfs');
  if (window.innerHeight > window.innerWidth) p.classList.add('rot');
  $('fsbtn').textContent = '✕ خروج';
  lockLand();
}
function exitFS(){
  const p = $('player');
  try {
    if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen();
    else if (document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen();
  } catch(e){}
  p.classList.remove('pfs', 'rot');
  $('fsbtn').textContent = '⛶ ملء الشاشة';
  unlockLand();
}
function toggleFS(){
  if (isFS()) { exitFS(); return; }
  const p = $('player');
  const req = p.requestFullscreen || p.webkitRequestFullscreen;
  if (!req) { pseudoFS(); return; }
  try {
    Promise.resolve(req.call(p)).then(() => {
      $('fsbtn').textContent = '✕ خروج';
      lockLand();
    }).catch(pseudoFS);
  } catch(e){ pseudoFS(); }
}
function onFSChange(){
  if (!document.fullscreenElement && !document.webkitFullscreenElement && !$('player').classList.contains('pfs')){
    $('fsbtn').textContent = '⛶ ملء الشاشة';
    unlockLand();
  }
}
document.addEventListener('fullscreenchange', onFSChange);
document.addEventListener('webkitfullscreenchange', onFSChange);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('player').classList.contains('pfs')) exitFS(); });

channels.forEach((ch, i) => {
  const b = document.createElement('button');
  b.className = 'ch'; b.textContent = ch.name;
  b.onclick = () => play(i);
  $('list').appendChild(b);
});

try { if (localStorage.getItem('juhood_ok') === '1') showSite(); } catch(e){}
</script>
</body>
</html>
