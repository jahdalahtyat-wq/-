<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>جهود سبورت</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#606060;color:#fff;font-family:Cairo,Arial,sans-serif;overflow-x:hidden}
.header{height:95px;background:#000;display:flex;justify-content:space-between;align-items:center;padding:0 15px;position:relative}
.header-title{position:absolute;left:50%;transform:translateX(-50%);font-size:28px;font-weight:900;white-space:nowrap}
.header-group{display:flex;align-items:center;gap:13px;z-index:2}
.icon{background:none;border:0;color:#fff;font-size:32px;cursor:pointer;padding:4px}
.tabs{height:70px;display:flex;background:#000;border-bottom:5px solid #606060}
.tab{flex:1;color:#fff;background:none;border:0;border-bottom:5px solid transparent;font-size:19px;font-weight:bold;font-family:inherit}
.tab.active{border-bottom-color:#c6a348}
.search-box{display:none;background:#111;padding:12px}
.search-box input{width:100%;height:45px;border:0;border-radius:8px;padding:10px;font-size:17px;font-family:inherit}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:11px;padding:12px}
.card{background:#000;border-radius:17px;padding:7px;aspect-ratio:.78;display:flex;flex-direction:column;align-items:center;cursor:pointer;overflow:hidden;min-width:0}
.card:focus{outline:3px solid #c6a348}
.card:active{transform:scale(.97)}
.logo{width:100%;aspect-ratio:1/1;flex-shrink:0;background:#151515;border-radius:12px;display:flex;justify-content:center;align-items:center;overflow:hidden;margin-bottom:8px;padding:0;position:relative}
.logo img{width:100%;height:100%;object-fit:contain;display:block}
.logo svg{width:100%;height:100%;display:block}
.logo .pk-num{position:absolute;top:4px;right:4px;z-index:2;background:#c6a348;color:#000;font-weight:900;font-size:clamp(11px,3vw,18px);min-width:1.7em;height:1.7em;padding:0 4px;border-radius:20px;display:flex;align-items:center;justify-content:center;direction:ltr}
.card-name{font-size:15px;font-weight:900;text-align:center;line-height:1.35;margin:auto 0;padding:3px 1px;direction:ltr}
.page-header{height:105px;background:#000;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;position:relative}
.page-title{position:absolute;left:50%;transform:translateX(-50%);font-size:25px;font-weight:900;white-space:nowrap;direction:ltr}
.page-actions{display:flex;gap:12px}
.empty{display:none;text-align:center;padding:40px;font-size:20px}
.overlay{display:none;position:fixed;inset:0;background:#0009;z-index:1000}
.overlay.show{display:block}
.side-menu{position:fixed;top:0;right:-290px;width:270px;height:100%;background:#111;z-index:2000;padding:25px;transition:.25s}
.side-menu.open{right:0}
.side-menu h2{font-size:28px;margin:35px 0}
.side-menu button{width:100%;padding:16px;margin:8px 0;background:#222;color:#fff;border:0;border-radius:8px;font-size:17px;text-align:right;font-family:inherit}

/* lock */
#lock{position:fixed;inset:0;z-index:5000;background:#000;display:flex;align-items:center;justify-content:center;padding:20px}
.lock-box{width:100%;max-width:360px;background:#111;border:1px solid #333;border-radius:20px;padding:30px 22px;text-align:center}
.lock-box h1{font-size:26px;font-weight:900;margin-bottom:6px}
.lock-box p{color:#aaa;font-size:14px;margin-bottom:18px}
.lock-box input{width:100%;height:52px;border-radius:10px;border:0;text-align:center;font-size:24px;letter-spacing:8px;font-family:inherit}
.lock-box button{width:100%;margin-top:14px;height:50px;border:0;border-radius:10px;background:#c6a348;color:#000;font-size:18px;font-weight:900;font-family:inherit}
#lockErr{color:#ff6b6b;font-size:14px;min-height:20px;margin-top:10px}

/* player */
#playerBox{position:absolute;inset:0}
#playerBox video{width:100%;height:100%;background:#000}
#playerMsg{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;font-size:17px;line-height:1.6;background:#000c;z-index:5;pointer-events:none}
#playerPage{position:fixed;inset:0;background:#000;z-index:3000;user-select:none;-webkit-user-select:none;touch-action:manipulation}
#playerPage.rot{inset:auto;top:0;left:0;transform-origin:0 0;transform:translateX(var(--pw)) rotate(90deg)}
.pstage{position:absolute;inset:0;background:#000;overflow:hidden}
#playerPage.fit-fill #playerBox video{object-fit:fill}
#playerPage.fit-contain #playerBox video{object-fit:contain}
#playerPage.fit-cover #playerBox video{object-fit:cover}
.pc{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;justify-content:space-between;transition:opacity .25s;background:linear-gradient(#000b,transparent 28%,transparent 70%,#0009)}
.pc.hide{opacity:0}
.pc.hide .pc-btn{pointer-events:none}
.pc-top{display:flex;align-items:center;gap:10px;direction:ltr;padding:14px 16px}
.pc-title{flex:1;text-align:center;font-size:clamp(16px,3.2vw,26px);font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pc-mid{display:flex;align-items:center;justify-content:center;gap:clamp(22px,7vw,64px);direction:ltr}
.pc-btn{background:#ffffff1f;color:#fff;border:2px solid #ffffff59;border-radius:50%;width:clamp(54px,9vw,74px);height:clamp(54px,9vw,74px);display:flex;align-items:center;justify-content:center;cursor:pointer;padding:0;font-size:clamp(22px,4vw,32px);font-weight:900}
.pc-btn svg{width:60%;height:60%}
.pc-btn.big{width:clamp(72px,13vw,104px);height:clamp(72px,13vw,104px)}
.pc-btn.small{width:clamp(44px,7vw,58px);height:clamp(44px,7vw,58px)}
.pc-btn:hover,.pc-btn:focus{border-color:#c6a348;background:#000c;outline:none}
.pc-btn.seek{flex-direction:column;line-height:1;font-family:inherit}
.pc-btn.seek .ar{font-size:clamp(16px,3vw,24px)}
.pc-btn.seek .sec{font-size:clamp(14px,2.6vw,20px)}
.pc-toast{position:absolute;top:22%;left:50%;transform:translateX(-50%);background:#000c;padding:8px 22px;border-radius:30px;font-size:24px;font-weight:900;display:none;z-index:12}
.pc-bottom{display:flex;align-items:center;direction:ltr;padding:12px 18px 14px}
.pc-live{display:flex;align-items:center;gap:8px;background:#ffffff1f;color:#fff;border:2px solid #ffffff59;border-radius:30px;padding:8px 18px;font-size:clamp(14px,2.6vw,20px);font-weight:900;cursor:pointer;font-family:inherit}
.pc-live i{width:12px;height:12px;border-radius:50%;background:#8a8a8a;display:block}
.pc-live.on i{background:#ff2d2d}
.pc-live b{color:#c6a348}
@media(max-width:500px){.header{height:85px}.header-title{font-size:22px}.icon{font-size:27px}.tabs{height:65px}.tab{font-size:16px}.card-name{font-size:14px}.page-title{font-size:22px}}
@media(max-width:350px){.card-name{font-size:12px}.grid{gap:7px;padding:8px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(5,minmax(0,1fr));gap:15px;padding:18px}.card-name{font-size:18px}}
</style>
</head>
<body>

<div id="lock"><div class="lock-box">
<h1>جهود سبورت</h1><p>اكتب كود التفعيل حتى تدخل التطبيق</p>
<input id="code" type="password" inputmode="numeric" maxlength="3" placeholder="•••" autocomplete="off">
<button onclick="tryCode()">تفعيل ودخول</button><div id="lockErr"></div>
</div></div>

<header class="header">
<div class="header-group"><button class="icon" onclick="toggleSearch()">⌕</button><button class="icon" onclick="refresh()">⟳</button></div>
<div class="header-title">جهود سبورت</div>
<div class="header-group"><button class="icon" onclick="settings()">⚙</button><button class="icon" onclick="toggleMenu()">☰</button></div>
</header>

<nav class="tabs">
<button class="tab active" onclick="changeTab('channels',this)">القنوات</button>
<button class="tab" onclick="changeTab('movies',this)">الأفلام</button>
<button class="tab" onclick="changeTab('series',this)">المسلسلات</button>
<button class="tab" onclick="changeTab('matches',this)">المباريات</button>
</nav>

<div class="search-box" id="searchBox"><input id="searchInput" placeholder="ابحث عن باقة..." oninput="searchItems()"></div>

<main id="home"><div class="grid" id="mainGrid"></div><div class="empty" id="empty">لا توجد نتائج</div></main>

<section id="innerPage" style="display:none">
<header class="page-header">
<button class="icon" onclick="stepBack()">←</button>
<div class="page-title" id="pageTitle"></div>
<div class="page-actions"><button class="icon" onclick="toggleInnerSearch()">⌕</button><button class="icon" onclick="renderChannels()">⟳</button></div>
</header>
<div class="search-box" id="innerSearch"><input id="channelSearch" placeholder="ابحث عن قناة..." oninput="searchChannel()"></div>
<div class="grid" id="channelGrid"></div>
<div class="empty" id="channelEmpty">لا توجد قنوات</div>
</section>

<section id="playerPage" style="display:none">
<div class="pstage">
<div id="playerBox"></div><div id="playerMsg"></div><div class="pc-toast" id="pcToast"></div>
<div class="pc" id="pc">
<div class="pc-top">
<button class="pc-btn small" onclick="stepBack()" aria-label="رجوع">←</button>
<div class="pc-title" id="playerTitle" dir="auto"></div>
<button class="pc-btn small" onclick="cycleFit()" aria-label="حجم الصورة">⤢</button>
<button class="pc-btn small" onclick="playStream()" aria-label="إعادة التحميل">⟳</button>
</div>
<div class="pc-mid">
<button class="pc-btn seek" onclick="seekBy(-10)"><span class="ar">⟲</span><span class="sec">10s</span></button>
<button class="pc-btn big" id="pcPlay" onclick="togglePlay()"></button>
<button class="pc-btn seek" onclick="seekBy(10)"><span class="ar">⟳</span><span class="sec">10s</span></button>
</div>
<div class="pc-bottom"><button class="pc-live on" id="pcLive" onclick="goLive()"><i></i><span>مباشر</span><b id="pcCount"></b></button></div>
</div></div>
</section>

<div class="overlay" id="overlay" onclick="toggleMenu()"></div>
<aside class="side-menu" id="sideMenu"><h2>جهود سبورت</h2>
<button onclick="goHome()">الرئيسية</button><button onclick="settings()">الإعدادات</button><button onclick="toggleMenu()">إغلاق</button></aside>

function logoHTML(pk,number,own){
let inner;
if(own==="syriac")inner=SYRIAC_SVG;

else inner=`<img src="${LOGOS[pk.logo]}" alt="${pk.name}">`;
const badge=(number&&own!=="syriac")?`<span class="pk-num">${number}</span>`:"";
return inner+badge;
}
function bgOf(pk,own){return own==="syriac"?"#fff":(pk.svg?"#000":(LOGO_BG[pk.logo]||"#151515"));}

let currentTab="channels",currentPackage="";

function mkCard(logoHtml,bg,name,onclick){
const card=document.createElement("div");card.className="card";card.tabIndex=0;
const l=document.createElement("div");l.className="logo";l.style.background=bg;l.innerHTML=logoHtml;
const n=document.createElement("div");n.className="card-name";n.textContent=name;
card.append(l,n);card.onclick=onclick;
card.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onclick();}};
return card;
}
function renderHome(){
const g=document.getElementById("mainGrid");g.innerHTML="";
const list=currentTab==="channels"?packages:[];
list.forEach(p=>g.appendChild(mkCard(logoHTML(p,""),bgOf(p),p.name,()=>openPackage(p.name))));
document.getElementById("empty").style.display=list.length?"none":"block";
}
function changeTab(c,b){currentTab=c;document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));b.classList.add("active");document.getElementById("searchBox").style.display="none";renderHome();}
function openPackage(name){
pushNav();currentPackage=name;

document.getElementById("pageTitle").textContent=name;
document.getElementById("innerSearch").style.display="none";
document.getElementById("channelSearch").value="";
renderChannels();
}
function renderChannels(){
const g=document.getElementById("channelGrid");g.innerHTML="";
const list=channels[currentPackage]||[];
list.forEach(c=>g.appendChild(mkCard(logoHTML(c.pk,c.number,c.own),bgOf(c.pk,c.own),c.name,()=>openPlayer(c))));
document.getElementById("channelEmpty").style.display=list.length?"none":"block";
}

/* ====== المشغل ====== */
const AUTO_CHAIN=["hls","videojs","clappr","mpegts","native"];
const LIBS={
hls:["https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"],
videojs:["https://cdnjs.cloudflare.com/ajax/libs/video.js/8.10.0/video.min.js","css:https://cdnjs.cloudflare.com/ajax/libs/video.js/8.10.0/video-js.min.css"],
clappr:["https://cdnjs.cloudflare.com/ajax/libs/clappr/0.3.13/clappr.min.js"],
mpegts:["https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"]
};
const libCache={};
function loadOne(src){
if(libCache[src])return libCache[src];
libCache[src]=new Promise((res,rej)=>{
if(src.startsWith("css:")){const l=document.createElement("link");l.rel="stylesheet";l.href=src.slice(4);l.onload=res;l.onerror=()=>rej();document.head.appendChild(l);}
else{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>{delete libCache[src];rej();};document.head.appendChild(s);}
});
return libCache[src];
}
const loadLib=n=>Promise.all((LIBS[n]||[]).map(loadOne));

let activePlayer=null,currentChannel=null,playToken=0,stallT=null,stallCount=0,hideT=null;
const NATIVE_NAMES=["exo","media3","exoplayer"];
function nativePlayer(){const n=window.NexoraNative;return(n&&typeof n.play==="function")?n:null;}

function openPlayer(c){
currentChannel=c;
const nat=nativePlayer();
if(nat&&c.url&&!(c.player&&!NATIVE_NAMES.includes(c.player))){nat.play(c.url,c.name);return;}
stallCount=0;pushNav();enterFullscreen();
document.getElementById("innerPage").style.display="none";
document.getElementById("playerPage").style.display="block";
document.getElementById("playerTitle").textContent=c.name;
layoutPlayer();setTimeout(layoutPlayer,300);
updatePlayIcon();showControls();playStream();
}
function setMsg(t){const m=document.getElementById("playerMsg");m.textContent=t||"";m.style.display=t?"flex":"none";}
function cleanupPlayer(){
try{if(activePlayer){const o=activePlayer.obj,t=activePlayer.type;
if(t==="hls")o.destroy();else if(t==="videojs")o.dispose();else if(t==="clappr")o.destroy();
else if(t==="mpegts"){o.pause();o.unload();o.detachMediaElement();o.destroy();}}}catch(e){}
activePlayer=null;
const box=document.getElementById("playerBox");
const v=box.querySelector("video");if(v){try{v.pause();v.removeAttribute("src");v.load();}catch(e){}}
box.innerHTML="";
}
function stopPlayer(){playToken++;clearTimeout(stallT);cleanupPlayer();setMsg("");}
function makeVideo(){const v=document.createElement("video");v.controls=false;v.autoplay=true;v.playsInline=true;v.setAttribute("playsinline","");document.getElementById("playerBox").appendChild(v);return v;}
function guessMime(u){u=u.toLowerCase().split("?")[0];return u.endsWith(".mp4")?"video/mp4":u.endsWith(".webm")?"video/webm":"application/x-mpegURL";}
function getChain(c){
if(c.player&&!NATIVE_NAMES.includes(c.player))return[c.player];
const u=c.url.toLowerCase().split("?")[0];
if(u.endsWith(".flv")||u.endsWith(".ts"))return["mpegts","hls","videojs","native"];
if(u.endsWith(".mp4"))return["native","videojs"];
return AUTO_CHAIN;
}
function tryPlayer(id,url,token){
return new Promise(async(resolve,reject)=>{
let done=false,timer=null;
const ok=()=>{if(done)return;done=true;clearTimeout(timer);resolve();};
const fail=()=>{if(done)return;done=true;clearTimeout(timer);reject();};
timer=setTimeout(fail,15000);
try{
if(id==="hls"||id==="ll"){
await loadLib("hls");if(token!==playToken)return fail();
const video=makeVideo();video.addEventListener("playing",ok);
if(window.Hls&&Hls.isSupported()){
const hls=new Hls({enableWorker:true,lowLatencyMode:id==="ll",startFragPrefetch:true,capLevelToPlayerSize:true,maxBufferLength:40,maxMaxBufferLength:90,maxBufferHole:.6,backBufferLength:60,liveSyncDurationCount:4,liveMaxLatencyDurationCount:12,nudgeMaxRetry:8,manifestLoadingMaxRetry:4,levelLoadingMaxRetry:4,fragLoadingMaxRetry:6,fragLoadingRetryDelay:800});
activePlayer={type:"hls",obj:hls};
hls.loadSource(url);hls.attachMedia(video);
hls.on(Hls.Events.MANIFEST_PARSED,()=>{video.play().catch(()=>{});});
let nr=0,mr=0,started=false;
video.addEventListener("playing",()=>{started=true;},{once:true});
hls.on(Hls.Events.FRAG_BUFFERED,()=>{nr=0;mr=0;});
hls.on(Hls.Events.ERROR,(e,d)=>{
if(!d.fatal)return;
if(d.type===Hls.ErrorTypes.NETWORK_ERROR&&started&&nr<5){nr++;setTimeout(()=>{try{hls.startLoad();}catch(x){}},800);return;}
if(d.type===Hls.ErrorTypes.MEDIA_ERROR&&mr<3){mr++;if(mr===2)hls.swapAudioCodec();hls.recoverMediaError();return;}
if(started){softReload();return;}
fail();
});
}else if(video.canPlayType("application/vnd.apple.mpegurl")){video.src=url;video.addEventListener("error",fail);}
else fail();
}else if(id==="videojs"){
await loadLib("videojs");if(token!==playToken)return fail();
const el=document.createElement("video");el.className="video-js vjs-default-skin";el.setAttribute("playsinline","");
document.getElementById("playerBox").appendChild(el);
const vjs=videojs(el,{controls:false,autoplay:true,preload:"auto",fill:true});
activePlayer={type:"videojs",obj:vjs};
vjs.on("playing",ok);vjs.on("error",fail);vjs.src({src:url,type:guessMime(url)});
}else if(id==="clappr"){
await loadLib("clappr");if(token!==playToken)return fail();
const h=document.createElement("div");h.style.cssText="width:100%;height:100%";
document.getElementById("playerBox").appendChild(h);
const cl=new Clappr.Player({source:url,parent:h,autoPlay:true,chromeless:true,width:"100%",height:"100%",playback:{playInline:true}});
activePlayer={type:"clappr",obj:cl};
cl.on(Clappr.Events.PLAYER_PLAY,ok);cl.on(Clappr.Events.PLAYER_ERROR,fail);
}else if(id==="mpegts"){
await loadLib("mpegts");if(token!==playToken)return fail();
if(!(window.mpegts&&mpegts.getFeatureList().mseLivePlayback))return fail();
const video=makeVideo();video.addEventListener("playing",ok);
const isFlv=url.toLowerCase().split("?")[0].endsWith(".flv");
const mp=mpegts.createPlayer({type:isFlv?"flv":"mpegts",isLive:true,url},{enableWorker:true,enableStashBuffer:true,stashInitialSize:1024*1024,liveBufferLatencyChasing:false,lazyLoad:false,autoCleanupSourceBuffer:true,autoCleanupMaxBackwardDuration:60,autoCleanupMinBackwardDuration:30});
let started=false;video.addEventListener("playing",()=>{started=true;},{once:true});
activePlayer={type:"mpegts",obj:mp};
mp.attachMediaElement(video);
mp.on(mpegts.Events.ERROR,()=>{if(started)softReload();else fail();});
mp.load();mp.play();
}else{
const video=makeVideo();video.addEventListener("playing",ok);video.addEventListener("error",fail);video.src=url;
}
}catch(e){fail();}
});
}
async function playStream(){
stopPlayer();
const token=playToken,url=currentChannel?currentChannel.url:"";
if(!url){setMsg("لا يوجد رابط بث لهذه القناة حالياً.");return;}
for(const id of getChain(currentChannel)){
if(token!==playToken)return;
cleanupPlayer();setMsg("جاري التحميل...");
try{await tryPlayer(id,url,token);if(token===playToken)setMsg("");return;}catch(e){if(token!==playToken)return;}
}
if(token===playToken){cleanupPlayer();setMsg("تعذر تشغيل هذه القناة حالياً.");}
}
function closePlayerUI(){
stopPlayer();clearTimeout(hideT);
document.getElementById("playerPage").style.display="none";
document.getElementById("innerPage").style.display="block";
resetLayout();exitFullscreen();
}

/* ====== أزرار التحكم ====== */
const vid=()=>document.querySelector("#playerBox video");
function updatePlayIcon(){
const v=vid(),p=v&&!v.paused;
document.getElementById("pcPlay").innerHTML=p?'<svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>':'<svg viewBox="0 0 24 24"><path fill="currentColor" d="M8 5v14l11-7z"/></svg>';
}
function scheduleHide(){clearTimeout(hideT);hideT=setTimeout(()=>{const v=vid();if(v&&!v.paused)document.getElementById("pc").classList.add("hide");},5000);}
function showControls(){document.getElementById("pc").classList.remove("hide");updateLive();scheduleHide();}
const fmtTime=s=>{s=Math.max(0,Math.round(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");};
function liveEdge(v){
if(activePlayer&&activePlayer.type==="hls"&&isFinite(activePlayer.obj.liveSyncPosition))return activePlayer.obj.liveSyncPosition;
const sk=v.seekable;return(sk&&sk.length)?sk.end(sk.length-1):null;
}
function updateLive(){
const v=vid();if(!v)return;
const e=liveEdge(v),b=e!==null?Math.max(0,e-v.currentTime):0,live=b<8;
document.getElementById("pcLive").classList.toggle("on",live);
document.getElementById("pcCount").textContent=live?"":"-"+fmtTime(b);
}
function goLive(){const v=vid();if(!v)return;const e=liveEdge(v);if(e!==null){try{v.currentTime=Math.max(e-2,0);}catch(x){}}v.play().catch(()=>{});flash("مباشر");showControls();}
setInterval(()=>{if(playerVisible()&&!document.getElementById("pc").classList.contains("hide"))updateLive();},500);
function togglePlay(){const v=vid();if(!v)return;if(v.paused)v.play().catch(()=>{});else v.pause();updatePlayIcon();showControls();}
function flash(t){const e=document.getElementById("pcToast");e.textContent=t;e.style.display="block";clearTimeout(flash.t);flash.t=setTimeout(()=>{e.style.display="none";},700);}
function seekBy(sec){
const v=vid();showControls();if(!v)return;
let t=v.currentTime+sec;const sk=v.seekable;
if(sk&&sk.length)t=Math.min(Math.max(t,sk.start(0)),sk.end(sk.length-1));
else if(isFinite(v.duration))t=Math.min(Math.max(t,0),v.duration);else return;
try{v.currentTime=t;}catch(e){}
flash(sec>0?"+"+sec+" ث":"−"+Math.abs(sec)+" ث");
}
function softReload(){if(playerVisible()&&++stallCount<=6)playStream();}
function onStall(){
if(!playerVisible())return;
const v=vid();if(!v||v.paused||v.readyState>=3)return;
if(activePlayer&&activePlayer.type==="hls"&&stallCount<2){stallCount++;try{activePlayer.obj.startLoad();const lp=activePlayer.obj.liveSyncPosition;if(isFinite(lp))v.currentTime=lp;}catch(e){}stallT=setTimeout(onStall,8000);return;}
softReload();
}
const pbox=document.getElementById("playerBox");
pbox.addEventListener("waiting",()=>{clearTimeout(stallT);stallT=setTimeout(onStall,8000);},true);
pbox.addEventListener("playing",()=>{clearTimeout(stallT);if(!document.getElementById("pc").classList.contains("hide"))scheduleHide();},true);
["play","pause","playing","waiting","loadstart"].forEach(ev=>pbox.addEventListener(ev,updatePlayIcon,true));
let lastTap=0;
function onScreenTap(e){
if(!playerVisible())return;
if(e.target&&e.target.closest&&e.target.closest(".pc-btn,.pc-live"))return;
const n=Date.now();if(n-lastTap<350)return;lastTap=n;showControls();
}
document.addEventListener("click",onScreenTap,true);
document.addEventListener("touchend",onScreenTap,true);

let fitMode="fill";
try{fitMode=localStorage.getItem("jhdFit")||"fill";}catch(e){}
if(!["fill","cover","contain"].includes(fitMode))fitMode="fill";
const FIT_NAMES={fill:"ملء الشاشة",cover:"قص الأطراف",contain:"الحجم الأصلي"};
function applyFit(){const p=document.getElementById("playerPage");p.classList.remove("fit-fill","fit-contain","fit-cover");p.classList.add("fit-"+fitMode);}
function cycleFit(){const o=["fill","cover","contain"];fitMode=o[(o.indexOf(fitMode)+1)%3];try{localStorage.setItem("jhdFit",fitMode);}catch(e){}applyFit();flash(FIT_NAMES[fitMode]);showControls();}
applyFit();

function layoutPlayer(){
const pg=document.getElementById("playerPage");if(pg.style.display!=="block")return;
const w=innerWidth,h=innerHeight;
if(h>w){pg.classList.add("rot");pg.style.width=h+"px";pg.style.height=w+"px";pg.style.setProperty("--pw",w+"px");}
else{pg.classList.remove("rot");pg.style.width="";pg.style.height="";}
}
function resetLayout(){const p=document.getElementById("playerPage");p.classList.remove("rot");p.style.width="";p.style.height="";}
addEventListener("resize",layoutPlayer);
addEventListener("orientationchange",()=>setTimeout(layoutPlayer,150));
function enterFullscreen(){try{const el=document.documentElement,f=el.requestFullscreen||el.webkitRequestFullscreen;if(f)Promise.resolve(f.call(el)).then(()=>{if(screen.orientation&&screen.orientation.lock)return screen.orientation.lock("landscape");}).catch(()=>{});}catch(e){}}
function exitFullscreen(){try{if(document.fullscreenElement&&document.exitFullscreen)document.exitFullscreen().catch(()=>{});if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock();}catch(e){}}
document.addEventListener("fullscreenchange",()=>{setTimeout(layoutPlayer,100);if(!document.fullscreenElement&&playerVisible()){lastBack=Date.now();stepBack();}});

/* ====== التنقل ====== */
let navDepth=0,ignorePop=0,lastBack=0;
const playerVisible=()=>document.getElementById("playerPage").style.display==="block";
const innerVisible=()=>document.getElementById("innerPage").style.display==="block";
const menuOpen=()=>document.getElementById("sideMenu").classList.contains("open");
function pushNav(){try{history.pushState({n:navDepth+1},"");navDepth++;}catch(e){}}
function uiBack(){if(playerVisible())closePlayerUI();else if(innerVisible())goHomeUI();}
function stepBack(){
if(menuOpen()){toggleMenu();return;}
if(!playerVisible()&&!innerVisible())return;
if(navDepth>0){history.back();return;}
uiBack();
}
addEventListener("popstate",()=>{
if(ignorePop>0){ignorePop--;return;}
if(navDepth>0)navDepth--;
if(menuOpen()){toggleMenu();pushNav();return;}
uiBack();
});
function goHomeUI(){
stopPlayer();resetLayout();exitFullscreen();
document.getElementById("playerPage").style.display="none";
document.getElementById("innerPage").style.display="none";
document.getElementById("home").style.display="block";
renderHome();
}
function goHome(){
if(menuOpen())toggleMenu();
goHomeUI();
if(navDepth>0){const d=navDepth;navDepth=0;ignorePop=1;history.go(-d);}
}

/* ====== بحث وقائمة ====== */
function toggleSearch(){const b=document.getElementById("searchBox");b.style.display=b.style.display==="block"?"none":"block";}
function filterCards(sel,val){document.querySelectorAll(sel+" .card").forEach(c=>{c.style.display=c.innerText.toLowerCase().includes(val.toLowerCase())?"flex":"none";});}
function searchItems(){filterCards("#mainGrid",document.getElementById("searchInput").value);}
function toggleInnerSearch(){const b=document.getElementById("innerSearch");b.style.display=b.style.display==="block"?"none":"block";}
function searchChannel(){filterCards("#channelGrid",document.getElementById("channelSearch").value);}
function refresh(){renderHome();}
function toggleMenu(){document.getElementById("sideMenu").classList.toggle("open");document.getElementById("overlay").classList.toggle("show");}
function settings(){alert("جهود سبورت");}

/* ====== ريموت وكيبورد ====== */
function moveFocus(dir){
let items=menuOpen()?[...document.querySelectorAll(".side-menu button")]:[...document.querySelectorAll(".icon,.tab,.card")];
items=items.filter(el=>el.getClientRects().length>0&&!el.closest("#playerPage"));
if(!items.length)return;
const cur=document.activeElement;
if(!cur||!items.includes(cur)){items[0].focus();return;}
const r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
let best=null,bs=Infinity;
items.forEach(el=>{
if(el===cur)return;
const b=el.getBoundingClientRect(),dx=b.left+b.width/2-cx,dy=b.top+b.height/2-cy,tol=Math.max(r.height,b.height)*.8;
let ok=false,s=0;
if(dir==="ArrowLeft"){ok=dx<-4&&Math.abs(dy)<=tol;s=-dx+Math.abs(dy)*3;}
else if(dir==="ArrowRight"){ok=dx>4&&Math.abs(dy)<=tol;s=dx+Math.abs(dy)*3;}
else if(dir==="ArrowUp"){ok=dy<-4;s=-dy+Math.abs(dx)*3;}
else{ok=dy>4;s=dy+Math.abs(dx)*3;}
if(ok&&s<bs){best=el;bs=s;}
});
if(best){best.focus();best.scrollIntoView({block:"nearest"});}
}
const isBackKey=e=>["Escape","Backspace","GoBack","BrowserBack","XF86Back"].includes(e.key)||[4,8,27,461,10009].includes(e.keyCode);
document.addEventListener("tizenhwkey",e=>{if(e.keyName==="back"){const n=Date.now();if(n-lastBack>350){lastBack=n;stepBack();}}});
document.addEventListener("keydown",e=>{
if(document.getElementById("lock").style.display!=="none")return;
if(e.target&&e.target.tagName==="INPUT")return;
if(isBackKey(e)){if(menuOpen()||playerVisible()||innerVisible()){e.preventDefault();const n=Date.now();if(n-lastBack>350){lastBack=n;stepBack();}}return;}
if(playerVisible()){
const k=e.key,onBtn=document.activeElement&&document.activeElement.classList&&document.activeElement.classList.contains("pc-btn");
if(k==="ArrowLeft"||k==="MediaRewind"){e.preventDefault();seekBy(-10);}
else if(k==="ArrowRight"||k==="MediaFastForward"){e.preventDefault();seekBy(10);}
else if(k==="MediaPlayPause"||k==="MediaPlay"||k==="MediaPause"){e.preventDefault();togglePlay();}
else if(k==="Enter"||k===" "){if(!onBtn){e.preventDefault();togglePlay();}}
else if(k==="ArrowUp"||k==="ArrowDown"){e.preventDefault();showControls();}
return;
}
if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key)){e.preventDefault();moveFocus(e.key);}
});

/* ====== كود التفعيل ====== */
function unlock(){document.getElementById("lock").style.display="none";try{localStorage.setItem("jhdOk","1");}catch(e){}}
function tryCode(){
if(document.getElementById("code").value.trim()===ACTIVATION_CODE)unlock();
else document.getElementById("lockErr").textContent="الكود غلط، جرب مرة ثانية";
}
document.getElementById("code").addEventListener("keydown",e=>{if(e.key==="Enter")tryCode();});
try{if(localStorage.getItem("jhdOk")==="1")unlock();}catch(e){}

renderHome();
setTimeout(()=>{loadLib("hls").catch(()=>{});},1500);
</script>
