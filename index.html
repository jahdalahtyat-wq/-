<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0f1e">
<title>JIHAD TV</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0f1e;--card:#10172b;--line:#262e45;--tile:#0b1120;--gold:#f5b73b;--text:#eef2fb;--muted:#8e9ab5;--g1:#f5a04a;--g2:#e4452f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg)}
body{font-family:Cairo,Tahoma,Arial,sans-serif;color:var(--text);min-height:100vh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);background:radial-gradient(circle at 20% 0%,#1a1030 0,transparent 40%),var(--bg)}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:900px;margin:auto;padding:16px 14px 40px}

/* hero */
.hero{border:1.5px solid #3a3426;border-radius:34px;padding:42px 20px 90px;text-align:center;background:linear-gradient(180deg,#0b1020,#0a0f1e);margin-bottom:22px;min-height:300px}
.app-ico{width:120px;height:120px;margin:0 auto 24px;display:block}
.hero h1{font-size:34px;font-weight:900;letter-spacing:5px}
.hero p{color:var(--muted);font-size:16px;margin-top:14px;font-weight:600}
hr.sep{border:0;border-top:1px solid var(--line);margin:0 -14px 18px}

/* packages */
.pk-grid{display:grid;grid-template-columns:1fr;gap:14px}
.pk{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:11px 12px;cursor:pointer;min-width:0;text-align:right;width:100%}
.pk:active{transform:scale(.98)}
.tile{width:96px;height:68px;flex:none;border-radius:14px;background:var(--tile);border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;overflow:hidden}
.tile img,.tile svg{width:100%;height:100%;object-fit:contain;display:block;padding:4px}
.pk .nm{flex:1;min-width:0;font-size:19px;font-weight:800;line-height:1.35;white-space:normal;word-break:break-word}
.cnt{flex:none;min-width:34px;padding:2px 10px;border-radius:20px;background:#3a2f17;border:1.5px solid #7a6330;color:var(--gold);font-weight:900;font-size:15px;text-align:center}

/* channel page */
#chPage{display:none}
.topbar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{width:44px;height:44px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);font-size:22px}
.topbar h2{flex:1;font-size:19px;font-weight:900;direction:ltr;text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pwrap{position:relative;aspect-ratio:16/9;background:#000;border:1.5px solid var(--line);border-radius:26px;overflow:hidden}
#pbox{position:absolute;inset:0}
#pbox video{width:100%;height:100%;background:#000;object-fit:contain}
#pmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;color:#cfd6e8;font-size:16px;line-height:1.7;background:#000a;z-index:3}
.pbtns{position:absolute;top:10px;left:10px;display:flex;gap:8px;z-index:4}
.pbtns button{width:38px;height:38px;border-radius:12px;background:#000a;font-size:18px;border:1px solid #ffffff30}
.engines{display:flex;gap:8px;overflow-x:auto;padding:12px 2px;scrollbar-width:none}
.engines::-webkit-scrollbar{display:none}
.eng{flex:none;padding:8px 16px;border-radius:20px;background:var(--card);border:1.5px solid var(--line);font-size:14px;font-weight:800;color:var(--muted);direction:ltr}
.eng.on{background:#3a2f17;border-color:var(--gold);color:var(--gold)}
.ch-search{width:100%;height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--text);padding:0 14px;font-family:inherit;font-size:15px;margin-bottom:12px}
.ch-grid{display:grid;grid-template-columns:1fr;gap:12px}
.ch{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px solid var(--line);border-radius:22px;padding:11px;cursor:pointer;min-width:0;width:100%;text-align:right}
.ch.on{border-color:var(--gold)}
.ch .info{flex:1;min-width:0}
.ch .cn{font-size:17px;font-weight:800;text-align:right;line-height:1.3;white-space:normal;word-break:break-word}
.ch .meta{display:flex;align-items:center;justify-content:flex-start;gap:6px;margin-top:6px;font-size:13px;color:var(--muted);font-weight:700}
.tag{padding:1px 9px;border-radius:8px;background:#3a2f17;border:1.5px solid #7a6330;color:var(--gold);font-weight:900;font-size:12.5px;direction:ltr}
.dot{width:9px;height:9px;border-radius:50%;background:#19c37d;display:inline-block}
.play{flex:none;width:52px;height:52px;border-radius:15px;background:linear-gradient(160deg,var(--g1),var(--g2));display:flex;align-items:center;justify-content:center}
.play svg{width:24px;height:24px}
.empty{display:none;text-align:center;color:var(--muted);padding:30px}

/* lock */
#lock{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 50% 0%,#1d1236 0,var(--bg) 60%);overflow:auto}
.lbox{width:100%;max-width:400px;background:var(--card);border:1.5px solid var(--line);border-radius:28px;padding:30px 22px;text-align:center}
.lbox .app-ico{width:84px;height:84px;margin-bottom:14px}
.lbox h1{font-size:26px;font-weight:900;letter-spacing:4px}
.lbox p.s{color:var(--muted);font-size:14px;margin:6px 0 18px}
#code{width:100%;height:54px;border-radius:14px;border:1.5px solid var(--line);background:var(--tile);color:var(--text);text-align:center;font-size:24px;letter-spacing:10px;font-family:inherit}
.btn{width:100%;height:50px;border-radius:14px;font-size:17px;font-weight:900;margin-top:12px}
.btn.gold{background:linear-gradient(160deg,var(--g1),var(--g2));color:#fff}
#lerr{min-height:22px;color:#ff6b7a;font-size:14px;margin-top:8px}
.tg{margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}
.tg svg{width:64px;height:64px;display:block;margin:0 auto 10px}
.tg b{display:block;font-size:16px;margin-bottom:4px}
.tg a{display:block;text-decoration:none;text-align:center;line-height:50px;background:#2aabee;color:#fff;margin-top:12px;border-radius:14px;font-weight:900;font-size:17px}
@media(max-width:420px){.pk .nm{font-size:17px}.tile{width:88px;height:64px}.cnt{padding:2px 9px;font-size:14px}.ch .cn{font-size:16px}.hero h1{font-size:28px}}
@media(min-width:760px){.pk-grid,.ch-grid{grid-template-columns:1fr 1fr;gap:16px}}
</style>
</head>
<body>

<div id="lock"><div class="lbox">
<svg class="app-ico" viewBox="0 0 120 120"><use href="#appico"/></svg>
<h1>JIHAD TV</h1>
<p class="s">اكتب كود التفعيل حتى تدخل</p>
<input id="code" type="password" inputmode="numeric" maxlength="3" placeholder="•••" autocomplete="off">
<button class="btn gold" onclick="tryCode()">تفعيل ودخول</button>
<div id="lerr"></div>
<div class="tg">
<svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="32" fill="#2aabee"/><path d="M47 19L14 31.500l8.500 2.700L42 22 28 37v8l5-5 7 5z" fill="#fff"/></svg>
<b>ماعندك كود؟</b>
<span style="color:var(--muted);font-size:14px">انضم هنا للحصول على الكود</span>
<a href="https://t.me/f2005ghad" target="_blank" rel="noopener">انضمام</a>
</div>
</div></div>

<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="appico" viewBox="0 0 120 120"><defs><linearGradient id="ag" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3b24d"/><stop offset=".5" stop-color="#d4204f"/><stop offset="1" stop-color="#2b78cc"/></linearGradient></defs><rect width="120" height="120" rx="30" fill="url(#ag)"/><rect x="26" y="32" width="68" height="44" rx="7" fill="#c4254f" stroke="#15122b" stroke-width="6"/><rect x="40" y="85" width="40" height="6" rx="3" fill="#15122b"/></symbol>
<symbol id="playi" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="#fff"/></symbol>
</defs></svg>

<main class="wrap" id="home">
<section class="hero">
<svg class="app-ico" viewBox="0 0 120 120"><use href="#appico"/></svg>
<h1>JIHAD TV</h1>
<p>بوابتك الأولى للبث المباشر والترفيه الرقمي</p>
</section>
<hr class="sep">
<div class="pk-grid" id="pkGrid"></div>
</main>

<section class="wrap" id="chPage">
<div class="topbar"><button class="back" onclick="backHome()" aria-label="رجوع">→</button><h2 id="chTitle"></h2></div>
<div class="pwrap">
<div id="pbox"></div>
<div id="pmsg">اختر قناة لتبدأ المشاهدة</div>
<div class="pbtns"><button onclick="reloadStream()" aria-label="إعادة تحميل">⟳</button><button onclick="goFull()" aria-label="ملء الشاشة">⛶</button></div>
</div>
<input class="ch-search" id="chSearch" placeholder="ابحث عن قناة..." oninput="filterCh()">
<div class="ch-grid" id="chGrid"></div>
<div class="empty" id="chEmpty">لا توجد قنوات</div>
</section>

const ch={name:c.n,tag:c.t,player:m?m[1].toLowerCase():"",url:m?m[2].trim():raw};
const b=document.createElement("button");b.className="ch";b.dataset.name=c.n.toLowerCase();
b.innerHTML=`<div class="tile" style="background:${curPkg.bg||""}">${tileHTML(curPkg)}</div><div class="info"><div class="cn">${c.n}</div><div class="meta"><span class="dot"></span><span>مباشر</span><span class="tag">${c.t}</span></div></div><div class="play"><svg viewBox="0 0 24 24"><use href="#playi"/></svg></div>`;
b.onclick=()=>{document.querySelectorAll(".ch.on").forEach(x=>x.classList.remove("on"));b.classList.add("on");playChannel(ch);$("chPage").scrollIntoView({behavior:"smooth"});};
g.appendChild(b);
});
$("chEmpty").style.display=curPkg.ch.length?"none":"block";
}
function filterCh(){
const v=$("chSearch").value.toLowerCase();
document.querySelectorAll("#chGrid .ch").forEach(c=>{c.style.display=c.dataset.name.includes(v)?"flex":"none";});
}
function backHome(){stopPlayer();setMsg("اختر قناة لتبدأ المشاهدة");$("chPage").style.display="none";$("home").style.display="block";curCh=null;}
let navDepth=0;
function pushNav(){try{history.pushState({n:1},"");navDepth++;}catch(e){}}
addEventListener("popstate",()=>{if(navDepth>0)navDepth--;if($("chPage").style.display==="block")backHome();});

/* ====== المشغلات ====== */
const LIBS={
hls:["https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.13/hls.min.js"],
videojs:["https://cdnjs.cloudflare.com/ajax/libs/video.js/8.10.0/video.min.js","css:https://cdnjs.cloudflare.com/ajax/libs/video.js/8.10.0/video-js.min.css"],
clappr:["https://cdnjs.cloudflare.com/ajax/libs/clappr/0.3.13/clappr.min.js"],
mpegts:["https://cdn.jsdelivr.net/npm/mpegts.js@1.7.3/dist/mpegts.js"]
};
const libCache={};
function loadOne(src){
if(libCache[src])return libCache[src];
libCache[src]=new Promise((res,rej)=>{
if(src.startsWith("css:")){const l=document.createElement("link");l.rel="stylesheet";l.href=src.slice(4);l.onload=res;l.onerror=()=>rej();document.head.appendChild(l);}
else{const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=()=>{delete libCache[src];rej();};document.head.appendChild(s);}
});
return libCache[src];
}
const loadLib=n=>Promise.all((LIBS[n==="ll"?"hls":n]||[]).map(loadOne));

let active=null,token=0,stallT=null,retries=0;
function setMsg(t){const m=$("pmsg");m.textContent=t||"";m.style.display=t?"flex":"none";}
function cleanup(){
try{if(active){const o=active.obj,t=active.type;
if(t==="hls")o.destroy();else if(t==="videojs")o.dispose();else if(t==="clappr")o.destroy();
else if(t==="mpegts"){o.pause();o.unload();o.detachMediaElement();o.destroy();}}}catch(e){}
active=null;
const v=$("pbox").querySelector("video");if(v){try{v.pause();v.removeAttribute("src");v.load();}catch(e){}}
$("pbox").innerHTML="";
}
function stopPlayer(){token++;clearTimeout(stallT);cleanup();}
function mkVideo(){const v=document.createElement("video");v.controls=true;v.autoplay=true;v.playsInline=true;v.setAttribute("playsinline","");$("pbox").appendChild(v);return v;}
const mime=u=>{u=u.toLowerCase().split("?")[0];return u.endsWith(".mp4")?"video/mp4":u.endsWith(".webm")?"video/webm":"application/x-mpegURL";};
function chainFor(c){
if(c.player)return[c.player];
const u=c.url.toLowerCase(),path=u.split("?")[0];
if(u.includes(".m3u8")||u.includes("m3u8"))return["hls","videojs","clappr","ll","native"];
if(path.endsWith(".ts"))return["mpegts","hls","videojs","clappr","native"];
if(path.endsWith(".flv"))return["mpegts","videojs","clappr","native"];
if(path.endsWith(".mp4")||path.endsWith(".webm")||path.endsWith(".mkv"))return["native","videojs","clappr"];
return["hls","mpegts","videojs","clappr","ll","native"];
}
function tryEngine(id,url,tk){
return new Promise(async(resolve,reject)=>{
let done=false,timer=null;
const ok=()=>{if(done)return;done=true;clearTimeout(timer);resolve();};
const fail=()=>{if(done)return;done=true;clearTimeout(timer);reject();};
timer=setTimeout(fail,15000);
try{
if(id==="hls"||id==="ll"){
await loadLib("hls");if(tk!==token)return fail();
const v=mkVideo();v.addEventListener("playing",ok);
if(window.Hls&&Hls.isSupported()){
const cfg=id==="ll"?{lowLatencyMode:true,liveSyncDurationCount:3,liveMaxLatencyDurationCount:8,maxLiveSyncPlaybackRate:1.2,backBufferLength:30,enableWorker:true}:{enableWorker:true,lowLatencyMode:false,startFragPrefetch:true,maxBufferLength:40,maxMaxBufferLength:90,maxBufferHole:.6,backBufferLength:60,liveSyncDurationCount:4,liveMaxLatencyDurationCount:12,nudgeMaxRetry:8,manifestLoadingMaxRetry:4,levelLoadingMaxRetry:4,fragLoadingMaxRetry:6,fragLoadingRetryDelay:800};
const hls=new Hls(cfg);active={type:"hls",obj:hls};
hls.loadSource(url);hls.attachMedia(v);
hls.on(Hls.Events.MANIFEST_PARSED,()=>{v.play().catch(()=>{});});
let nr=0,mr=0,st=false;
v.addEventListener("playing",()=>{st=true;},{once:true});
hls.on(Hls.Events.FRAG_BUFFERED,()=>{nr=0;mr=0;});
hls.on(Hls.Events.ERROR,(e,d)=>{
if(!d.fatal)return;
if(d.type===Hls.ErrorTypes.NETWORK_ERROR&&st&&nr<5){nr++;setTimeout(()=>{try{hls.startLoad();}catch(x){}},800);return;}
if(d.type===Hls.ErrorTypes.MEDIA_ERROR&&mr<3){mr++;if(mr===2)hls.swapAudioCodec();hls.recoverMediaError();return;}
if(st){softReload();return;}
fail();
});
}else if(v.canPlayType("application/vnd.apple.mpegurl")){v.src=url;v.addEventListener("error",fail);}
else fail();
}else if(id==="videojs"){
await loadLib("videojs");if(tk!==token)return fail();
const el=document.createElement("video");el.className="video-js vjs-default-skin vjs-big-play-centered";el.setAttribute("playsinline","");
$("pbox").appendChild(el);
const vjs=videojs(el,{controls:true,autoplay:true,preload:"auto",fill:true});
active={type:"videojs",obj:vjs};
vjs.on("playing",ok);vjs.on("error",fail);vjs.src({src:url,type:mime(url)});
}else if(id==="clappr"){
await loadLib("clappr");if(tk!==token)return fail();
const h=document.createElement("div");h.style.cssText="width:100%;height:100%";$("pbox").appendChild(h);
const cl=new Clappr.Player({source:url,parent:h,autoPlay:true,width:"100%",height:"100%",playback:{playInline:true}});
active={type:"clappr",obj:cl};
cl.on(Clappr.Events.PLAYER_PLAY,ok);cl.on(Clappr.Events.PLAYER_ERROR,fail);
}else if(id==="mpegts"){
await loadLib("mpegts");if(tk!==token)return fail();
if(!(window.mpegts&&mpegts.getFeatureList().mseLivePlayback))return fail();
const v=mkVideo();v.addEventListener("playing",ok);
const flv=url.toLowerCase().split("?")[0].endsWith(".flv");
const mp=mpegts.createPlayer({type:flv?"flv":"mpegts",isLive:true,url},{enableWorker:true,enableStashBuffer:true,stashInitialSize:1024*1024,liveBufferLatencyChasing:false,lazyLoad:false,autoCleanupSourceBuffer:true,autoCleanupMaxBackwardDuration:60,autoCleanupMinBackwardDuration:30});
let st=false;v.addEventListener("playing",()=>{st=true;},{once:true});
active={type:"mpegts",obj:mp};
mp.attachMediaElement(v);
mp.on(mpegts.Events.ERROR,()=>{if(st)softReload();else fail();});
mp.load();mp.play();
}else{
const v=mkVideo();v.addEventListener("playing",ok);v.addEventListener("error",fail);v.src=url;
}
}catch(e){fail();}
});
}
function playChannel(c){curCh=c;retries=0;playStream();}
async function playStream(){
stopPlayer();
const tk=token,url=curCh?curCh.url:"";
if(!url){setMsg("لا يوجد رابط بث لهذه القناة حالياً.");return;}
for(const id of chainFor(curCh)){
if(tk!==token)return;
cleanup();setMsg("جاري التحميل...");
try{await tryEngine(id,url,tk);if(tk===token)setMsg("");return;}catch(e){if(tk!==token)return;}
}
if(tk===token){cleanup();setMsg("تعذر تشغيل هذه القناة حالياً.");}
}
function reloadStream(){if(curCh)playStream();}
function softReload(){if(curCh&&++retries<=6)playStream();}
function goFull(){const e=document.querySelector(".pwrap");const f=e.requestFullscreen||e.webkitRequestFullscreen;if(f)f.call(e);}
$("pbox").addEventListener("waiting",()=>{clearTimeout(stallT);stallT=setTimeout(()=>{const v=$("pbox").querySelector("video");if(v&&!v.paused&&v.readyState<3)softReload();},9000);},true);
$("pbox").addEventListener("playing",()=>clearTimeout(stallT),true);

/* ====== كود التفعيل ====== */
function unlock(){$("lock").style.display="none";try{localStorage.setItem("jtOk","1");}catch(e){}}
function tryCode(){if($("code").value.trim()===ACTIVATION_CODE)unlock();else $("lerr").textContent="الكود غلط، جرب مرة ثانية أو انضم للقناة للحصول عليه";}
$("code").addEventListener("keydown",e=>{if(e.key==="Enter")tryCode();});
try{if(localStorage.getItem("jtOk")==="1")unlock();}catch(e){}

renderHome();
setTimeout(()=>{loadLib("hls").catch(()=>{});},1500);
</script>
